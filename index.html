<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Vlie | Code Semantic Engine</title>
    <meta name="description" content="A high-performance, AI-native code semantic engine for the JVM ecosystem.">
    
    <meta property="og:title" content="Vlie">
    <meta property="og:description" content="A high-performance, AI-native code semantic engine for the JVM ecosystem. Built in Rust.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#0d1117">

    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --prompt-color: #3fb950;
            /* Reliable system monospace stack */
            --font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80vh;
        }
        .prompt::before {
            content: "~ ❯ ";
            color: var(--prompt-color);
            font-weight: bold;
        }
        .command {
            color: #fff;
            font-weight: bold;
        }
        h1 {
            color: var(--text-color);
            font-size: 2rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 0.5rem;
        }
        .dimmed {
            color: #8b949e;
            margin-bottom: 1.5rem;
            display: block;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: var(--text-color);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        /* Respect OS-level reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>

    <div>
        <div class="prompt"><span class="command">vlie</span></div>
        
        <h1>Vlie</h1>

        <p>A high-performance, AI-native code semantic engine for the JVM ecosystem.</p>
        <p>Open source. Built in Rust. Extensible via Starlark.</p>
        
        <p class="dimmed">Status: Work in progress.</p>

        <div class="prompt"><span class="command">cat links.txt</span></div>
        <p>Follow updates: <a href="https://github.com/retran" target="_blank">github.com/retran</a></p>

        <br>
        <div class="prompt"><span class="cursor"></span></div>
    </div>

</body>
</html>
